name: Bug 报告 | Bug Report
description: 反馈软件缺陷或异常 | Report a bug to help us improve
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。填得越具体，定位越快。

        提之前请先做两件事：
        1. 确认用的是最新构建（版本号在 设置 → 关于 里能看到，形如 `0.1d-daily`）
        2. **把日志带上**。程序目录下 `Logs/` 里最新的那个文件，比截图有用得多

        Two things before you file:
        1. Make sure you are on the latest build (version shows in Settings → About, like `0.1d-daily`)
        2. **Attach the log.** The newest file under `Logs/` next to the executable helps far more than screenshots
  - type: input
    id: version
    attributes:
      label: 软件版本 | App Version
      description: 设置 → 关于 里那一行，形如 0.1d-daily | The line in Settings → About, e.g. 0.1d-daily
      placeholder: 0.1d-daily
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统及版本 | OS & Version
      placeholder: 例如 Windows 10 22H2 64位 | e.g. Windows 10 22H2 64bit
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 白板设备型号 | Whiteboard Model
      description: 如果是触控相关问题，这一项很关键——不同设备的触摸报点行为不一样 | Critical for touch-related issues; touch reporting differs between devices
      placeholder: 例如 希沃 F86EC | e.g. Seewo F86EC
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: 问题描述 | Description
      description: 说清「什么情况下、出现了什么」，不要只写「卡」或「坏了」 | Describe what happened under what circumstances; "it's laggy" alone is not enough
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 | Steps to Reproduce
      description: 能否稳定复现？试了几次里几次出问题？ | Is it reproducible? How many times out of how many attempts?
      placeholder: |
        1.
        2.
        3.

        复现率：__ / __ 次
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 | Expected Behavior
      description: 你认为应该是什么样 | What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 其他补充信息 | Additional Info
      description: 崩溃日志（Crashes/ 目录）、配置文件、特殊环境等 | Crash logs (Crashes/), config files, unusual environment, etc.
    validations:
      required: false
  - type: upload
    id: files
    attributes:
      label: 上传日志和文件 | Upload logs and files
      description: "强烈建议把 Logs/ 下最新的日志传上来 | Strongly recommended: attach the newest log from Logs/"
    validations:
      required: false
