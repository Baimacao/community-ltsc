name: 功能请求 | Feature Request
description: 提出你对本项目的功能建议 | Suggest an idea for this project
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        **先说清一件事**：这个分支的定位是「只修不加」，重心在稳定性和课堂可用性上。
        新功能不是不能提，但如果你的想法是「上游加了这个，这里也该同步」，
        直接说一声会省很多讨论。

        This branch is **fixes-first** — stability and classroom usability take priority.
        New features are not forbidden, but if your idea is "upstream added this, please sync",
        saying so up front saves a lot of back-and-forth.
  - type: textarea
    id: description
    attributes:
      label: 功能描述 | Description
      description: 你希望它是什么样？尽量描述「用起来怎样」，而不是「代码怎么写」 | What should it feel like in use? Describe the experience rather than the implementation
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 需求动机 | Motivation
      description: 现在这件事你是怎么处理的？为什么现有方式不够用？ | How do you handle this today, and why isn't that enough?
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: 期望设计 | Expected Design
      description: 可选。画个草图或者描述交互都行 | Optional. A sketch or a description of the interaction
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 其他补充信息 | Additional Info
      description: 比如上游是否已有类似实现、相关讨论链接 | e.g. similar upstream work, related discussions
    validations:
      required: false
  - type: upload
    id: files
    attributes:
      label: 上传有关文件 | Upload relevant files
      description: "截图、录屏、参考链接都行 | Screenshots, recordings, links"
    validations:
      required: false
